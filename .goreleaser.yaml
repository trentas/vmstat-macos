version: 2

project_name: vmstat-macos

before:
  hooks:
    - go mod tidy

builds:
  # The collector is cgo against Mach, libproc and IOKit, so darwin is the only
  # target that produces a working binary and it must be built on a macOS host.
  - id: vmstat
    binary: vmstat
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: vmstat
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
