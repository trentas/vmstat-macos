name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt · vet · test · build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ─── macOS lane ───────────────────────────────────────────────────────
      # The collector is cgo against Mach, libproc and IOKit, so the real test
      # suite only runs here. macOS runners ship the command line tools.

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      # The collector tests sample the live system, so they must not run in
      # parallel with each other; -count=1 also defeats the result cache.
      - name: go test -race
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /tmp/vmstat .

      - name: smoke test
        run: |
          /tmp/vmstat -q --linux 1 3
          /tmp/vmstat -q --json | python3 -c 'import json,sys; json.load(sys.stdin)'

  cross:
    name: build stub (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ─── Non-darwin lane ──────────────────────────────────────────────────
      # main_other.go must keep compiling so that `go install` on Linux fails
      # with a clear message instead of a cgo error, and so pkg.go.dev (which
      # builds on Linux) can render the docs.

      - name: go build
        run: go build -o /tmp/vmstat .

      - name: stub exits with a clear message
        run: |
          if /tmp/vmstat; then echo "expected a non-zero exit on linux"; exit 1; fi
          /tmp/vmstat 2>&1 | grep -q "only runs on macOS"
