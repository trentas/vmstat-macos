name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser (macOS)
    # Must run on macOS: the collector is cgo against Mach, libproc and IOKit,
    # and arm64 has no cross-compiler on a Linux runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Publishes the release itself.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the updated cask to trentas/homebrew-tap over SSH.
          # GITHUB_TOKEN cannot write to another repository; this is a deploy
          # key scoped write-only to the tap, so a leak cannot touch any other
          # repo. Rotate with:
          #   ssh-keygen -t ed25519 -f k -N ''
          #   gh api repos/trentas/homebrew-tap/keys -f key="$(cat k.pub)" -F read_only=false
          #   gh secret set HOMEBREW_TAP_DEPLOY_KEY --repo trentas/vmstat-macos < k
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
